{% extends 'base.html' %}
{% block title %}Checkout{% endblock %}
{% block content %}
<div class="container my-4">
  <h2 class="section-title h4">Checkout</h2>
  <div class="row g-4">
    <div class="col-lg-7">
      <div class="food-card p-4">
        <h3 class="h6 mb-3">Order Summary</h3>
        {% for ci in items %}
        <div class="d-flex justify-content-between border-bottom py-2">
          <span>{{ ci.quantity }} × {{ ci.food_item.name }}</span>
          <span>₹{{ ci.line_total }}</span>
        </div>
        {% endfor %}
        <div class="d-flex justify-content-between h5 mt-3">
          <span>Total</span><span>₹{{ cart.subtotal }}</span>
        </div>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="food-card p-4">
        <form method="post">
          {% csrf_token %}
          <label class="form-label fw-semibold">Delivery / pickup note (optional)</label>
          <textarea name="delivery_note" class="form-control mb-3" rows="3" placeholder="e.g. Pickup at counter 2 after 1pm"></textarea>
          <button type="submit" class="btn btn-chili w-100">Place Order</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
